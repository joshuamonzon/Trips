<title>Japan 50 Trip Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sticky stop tabs → per-stop panel = to-scale pin map (left, sticky on desktop) + day-by-day list (right) */
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --fg:#1E1B17; --muted:#6E675E; --line:#E3DED4; --soft:#F1EEE7;
  --accent:#C4361B; --stop:#2458B5; --transit:#8B857B;
  --d1:#2458B5; --d2:#1E8A7A; --d3:#7048B8; --d4:#B8740F;
  --map:#F3F0E9; --grid:#E4DFD5;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141518; --surface:#1C1D22; --fg:#ECE8E0; --muted:#A39D93; --line:#2C2E35; --soft:#22242B;
  --accent:#F0603F; --stop:#6E9EFF; --transit:#8F8A82;
  --d1:#6E9EFF; --d2:#3FB8A6; --d3:#A78BFA; --d4:#E0A23A;
  --map:#1A1B20; --grid:#26282F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1C1D22; --fg:#ECE8E0; --muted:#A39D93; --line:#2C2E35; --soft:#22242B;
  --accent:#F0603F; --stop:#6E9EFF; --transit:#8F8A82;
  --d1:#6E9EFF; --d2:#3FB8A6; --d3:#A78BFA; --d4:#E0A23A;
  --map:#1A1B20; --grid:#26282F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{padding-block:28px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.sleep{background:var(--accent);border-radius:2px}
.dot.stop{background:var(--stop)}
.dot.transit{background:var(--transit)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button b{font-family:var(--display);font-weight:700;color:var(--fg);margin-right:5px}
nav.tabs button:hover{background:var(--soft)}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.tabs button[aria-selected="true"] b{color:var(--bg)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{padding-block:24px 0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:6px}
.panel-head h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,32px);margin:0;line-height:1.15}
.panel-head .kanji{font-family:var(--display);color:var(--muted);font-size:20px}
.panel-head .meta{color:var(--muted);font-size:14px}
.hotel-line{display:flex;align-items:flex-start;gap:10px;margin:8px 0 18px;font-size:14px;max-width:70ch}
.hotel-line .dot{margin-top:5px;flex:none}
.hotel-line a{font-weight:700;text-decoration-color:var(--accent)}
.hotel-line .n{color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:900px){ .grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start} .mapcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px)} }

.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.mapbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.mapbar .days{display:flex;flex-wrap:wrap;gap:4px 12px}
.mapbar .days span{display:inline-flex;align-items:center;gap:5px}
.mapbar .zoom{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mapbar button{border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
.mapbar button:first-child{border-left:0}
.mapbar button:hover{background:var(--soft)}
.mapbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.mapbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.map{display:block;width:100%;height:auto;background:var(--map);max-width:100%}
svg.map text{font-family:var(--body);fill:var(--fg)}
svg.map .lbl{font-size:11px;paint-order:stroke;stroke:var(--map);stroke-width:3px;stroke-linejoin:round}
svg.map .lbl.sleep{font-weight:700}
svg.map .num{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.map .pin{cursor:pointer}
svg.map .pin circle,svg.map .pin rect{stroke:var(--map);stroke-width:1.5}
svg.map .pin.sel circle,svg.map .pin.sel rect{stroke:var(--fg);stroke-width:2.5}
svg.map .route{fill:none;stroke-width:1.8;stroke-dasharray:4 4;opacity:.75}
svg.map .scale line{stroke:var(--fg);stroke-width:1.5}
svg.map .scale text{font-size:10px;fill:var(--muted)}
svg.map .grid line{stroke:var(--grid);stroke-width:1}
.offmap{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.offmap b{color:var(--fg);font-weight:500}
.detail{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;min-height:64px}
.detail .t{font-weight:700}
.detail .m{color:var(--muted);font-size:13px}
.detail .links{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;font-size:13px}

.days-list{display:flex;flex-direction:column;gap:18px;min-width:0}
.day{border-top:3px solid var(--dc);padding-top:10px}
.day h3{margin:0;font-family:var(--body);font-weight:700;font-size:15px}
.day h3 .date{color:var(--dc);margin-right:8px}
.day h3 .bday{color:var(--accent)}
.day .tt{color:var(--muted);font-size:14px;margin:2px 0 10px;text-wrap:balance}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:26px 62px minmax(0,1fr);gap:0 10px;padding:9px 6px 9px 2px;border-radius:8px;position:relative;cursor:pointer}
.stop:hover,.stop.sel{background:var(--soft)}
.stop + .stop::before{content:"";position:absolute;left:14px;top:-9px;height:9px;border-left:2px dashed var(--line)}
.badge{width:24px;height:24px;border-radius:50%;background:var(--dc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.badge.sleep{background:var(--accent);border-radius:5px}
.badge.transit{background:var(--transit)}
.time{font-size:12px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.body{min-width:0}
.body .name{font-weight:700}
.body .name a{text-decoration:none;border-bottom:1px solid var(--line)}
.body .name a:hover{border-color:var(--fg)}
.body .note{color:var(--muted);font-size:13.5px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--fg);text-decoration:none;background:var(--surface)}
.chip:hover{border-color:var(--fg)}
.chip .arrow{color:var(--muted)}
.chip.h{border-style:dashed}
.hop{grid-column:3;font-size:12px;color:var(--muted);margin-top:-6px;padding-bottom:4px}

/* overview */
.ov{display:grid;gap:22px}
@media (min-width:900px){ .ov{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start} }
.picks{margin:6px 0 2px 0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;line-height:1.45}
.picks b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.picks .pk{display:block;padding:2px 0}
.picks .pk a{font-weight:600}
.picks .pk span{color:var(--muted)}
.legs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.legs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.legs .how{color:var(--muted);font-size:13px}
.legs .dur{font-family:var(--display);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.legs .cost{color:var(--muted);font-size:12px;text-align:right}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin-top:14px}
.note b{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:no-preference){ .stop,.chip{transition:background .15s,border-color .15s} }
</style>

<div class="wrap">
<header class="top">

</header>

u: yakitori under the train tracks. 25 min away now; save it for the Dec 1 Fuji return if you want it."}]},{"date":"Sun Nov 29","title":"Old Tokyo at dawn, matcha, pancakes, Dad's watch, Mom's frames (order today), denim, the city from the roof at sunset","stops":[{"pin":"sensoji","time":"6:30am","note":"Asakusa line from Higashi-Ginza, direct, 20 min. Tokyo's oldest temple at dawn, 30 min, then Nakamise street. By 10am it's a mob.","hop":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.714765,139.796655&travelmode=transit"},"from_hotel":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.714765,139.796655&travelmode=transit"}},{"pin":"hatoya","time":"9am","note":"Matcha whisked in front of you. Opens 9; be there at 8:50 or the line is 30 min.","hop":{"min":8,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.714765,139.796655&destination=35.714537,139.801464&travelmode=walking"},"from_hotel":{"min":30,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.714537,139.801464&travelmode=transit"}},{"pin":"micasadeco","time":"9:45am","note":"Ricotta pancakes. Opens 10 on Sunday; the line forms 30 min early. Harajuku.","hop":{"min":40,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.714537,139.801464&destination=35.666554,139.705427&travelmode=transit"},"from_hotel":{"min":25,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.666554,139.705427&travelmode=transit"}},{"pin":"watchnian","time":"11:30am","note":"Pre-owned Rolex / Omega / Cartier with service records, tax-free, English staff. Dad's browse. 5.0 across 1,600 reviews.","hop":{"min":15,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.666554,139.705427&destination=35.659994,139.698840&travelmode=walking"},"from_hotel":{"mi ":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.667129,139.703807&travelmode=transit"}},{"pin":"shibuyasky","time":"4pm","note":"The open-air roof over the crossing. Sunset is 4:28; book the 4pm slot the day tickets open (sunset sells out first). Fuji on a clear day.","hop":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.667129,139.703807&destination=35.658672,139.701985&travelmode=walking"},"from_hotel":{"min":30,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.658672,139.701985&travelmode=transit"}},{"pin":"zauo","time":"6:15pm","note":"Fish your own dinner from the boat; they cook it how you want. Reserve. Done by 8.","hop":{"min":8,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.658672,139.701985&destination=35.662474,139.699854&travelmode=walking"},"from_hotel":{"min":30,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.662474,139.699854&travelmode=transit"}},{"pin":"mitsui","time":"8:30pm","note":"Ginza line back, 20 min. Day two of jet lag is the hard one. Bed.","hop":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.662474,139.699854&destination=35.668882,139.766754&travelmode=transit"},"from_hotel":null}],"picks":[{"pin":"imopippi","blurb":"Asakusa: crème-brûlée sweet potato, cash only, 11am open (so only if you're still in Asakusa)."},{"pin":"iyoshi","blurb":"Asakusa: craft cola made in front of you. Opens 12:30, so a Nov 30 Kappabashi add-on instead."},{"pin":"mameya","blurb":"Omotesando: the best coffee shop in Tokyo, no sign, beans from 20 roasters. 10–6."},{"pin":"nozy","blurb":"Cat Street: roastery + espresso martinis. On the walk between Micasadeco and Watchnian."},{"pin":"sedai","blurb":"Harajuku: tiny roaster, 4.8, cheap. Two min from Micasadeco."},{"pin":"matchatokyo","blurb":"Omotesando: matcha latte with a window over the street. 11–6:50."},{"pin":"menchirashi","blurb":"Harajuku: the carbonara udon. 30-min line, next door to Micasadeco. Only if you skip Onodera."},{"pin":"harry","blurb":"Harajuku: the otter café. Reserve. Novelty, skip unless Mom wants the otters."},{"pin":"megadonki","blurb":"Shibuya: 7 floors of Don Quijote, 24 hrs, tax-free on 7F. Souvenir run any night."},{"pin":"sgclub","blurb":"Shibuya: one of the world's top-50 cocktail bars, opens 6. Not on a jet-lag night."}]},{"date":"Mon Nov 30","title":"A chef walks you through the fish market, the knife street, pillows made to your neck, teamLab, vintage town, then the T-bone","stops":[{"pin":"tsukiji","time":"10am","note":"12-min walk from the hotel. Tsukiji food tour with Ali (ex-Milos seafood chef), 10–noon. Meet at the Shinran Shonin statue. Food not included: bring cash. airbnb.com/experiences/6919404. Not booked yet: book it.","hop":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.664770,139.770252&travelmode=walking"},"from_hotel":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.664770,139.770252&travelmode=walking"}},{"pin":"kappabashi","time":"12:30pm","note":"Knives engraved with your name. Buy now, forward home in the suitcase.","hop":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.664770,139.770252&destination=35.710580,139.787964&travelmode=transit"},"from_hotel":{"min":25,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.710580,139.787964&travelmode=transit"}},{"pin":"nishikawa","time":"1:30pm","note":"Custom-fit pillow at Nishikawa, Matsuya 7F, 5 min from the hotel. Walk-in OK: ~30 min fitting, ~40 min to make, so shop Ginza while it's built.","hop":{"min":25,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.710580,139.787964&destination=35.672330,13 u sando. Same street as T; lunch, not dinner."},{"pin":"zoetrope","blurb":"Shinjuku: 300 Japanese whiskies, 5 min from the hotel."}]},{"date":"Tue Dec 1","title":"Mt. Fuji day trip, then the sushi counter","stops":[{"pin":"shinjuku","time":"7:15am","note":"Marunouchi line from Ginza, 16 min, leave the hotel at 6:50. Fuji Excursion train, 7:30 departure. Right side faces the mountain.","hop":{"min":16,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.689607,139.700571&travelmode=transit"},"from_hotel":{"min":16,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.668882,139.766754&destination=35.689607,139.700571&travelmode=transit"}},{"pin":"kawaguchiko","time":"9:20am","note":"Arrive lakeside.","hop":{"min":110,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=35.689607,139.700571&destination=35.498236,138.768841&travelmode=transit"},"from_hotel":null},{"pin":"tenjo","time":"10am","note":"An hour of real climbing to a viewpoint where Fuji fills the horizon. Ropeway down.","hop":{"min":15,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.498236,138.768841&destination=35.503802,138.774378&travelmode=walking"},"from_hotel":null},{"pin":"hoto","time":"12:30pm","note":"Hoto: fat-noodle miso stew.","hop":{"min":15,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.503802,138.774378&destination=35.498861,138.768655&travelmode=walking"},"from_hotel":null},{"pin":"oishi","time":"2pm","note":"Lakeshore reflection shot.","hop":{"min":25,"mode":"bus","url":"https://www.google.com/maps/dir/?api=1&origin=35.498861,138.768655&destination=35.522904,138.745752&travelmode=transit"},"from_hotel":null},{"pin":"kawaguchiko","time":"3:45pm","note":"Train back by 4.","hop":{"min":25,"mode":"bus","url":"https://www.google.com/maps/dir/?api=1&origin=35.522904,138.745752&destination=35.498236,138.768841&travelmode=transit"},"from_hotel":null},{"pin":"shinjuku"," ":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.998399,135.780843&destination=34.994666,135.784661&travelmode=walking"},"from_hotel":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.007950,135.769220&destination=34.994666,135.784661&travelmode=transit"}},{"pin":"mouriya","time":"6:30pm","note":"Mouriya Gion, a private room on the 2nd floor: certified Kobe beef (sirloin and fillet) cooked on the teppan in front of you, foie gras course. 4.8 across 1,700 reviews. ~$400 for two. Reserve the private room by name.","hop":{"min":20,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.994666,135.784661&destination=35.003350,135.772750&travelmode=walking"},"from_hotel":{"min":11,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.007950,135.769220&destination=35.003350,135.772750&travelmode=walking"}},{"pin":"resol","time":"9pm","note":"","hop":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=35.003350,135.772750&destination=35.007950,135.769220&travelmode=walking"},"from_hotel":null}],"picks":[{"pin":"komori","blurb":"Gion: warabi mochi on tatami, 11–6:30, cash. Closed Tue, so today, not tomorrow."},{"pin":"itoh","blurb":"Gion: Nobu's Kyoto room, wagyu + black cod miso. Dinner backup if Mouriya's room is gone."}]},{"date":"Tue Dec 8 · Mom turns 50","title":"The birthday: kimono and a photographer in the empty lanes, a private tea ceremony, Pontocho at blue hour, then the oldest three-star in Japan","stops":[{"pin":"yasakapagoda","time":"8:30am","note":"Kimono dressed at 7:45 (book a shop that opens early for shoots), then a private photographer for 90 min: the pagoda lane, Ninenzaka, Gion, before anyone's there. ~$350. Both of you in kimono; Dad gets a haori.","hop":{"min":15,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=35.007950,135.769220&destination=34.998559,135.779178&travelmode=transit"},"from_hotel":{"min":15,"mode":"taxi", igin=35.003934,135.771044&destination=35.011413,135.786762&travelmode=transit"},"from_hotel":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=35.007950,135.769220&destination=35.011413,135.786762&travelmode=transit"}},{"pin":"resol","time":"9:30pm","note":"Or one more whisky at Bar K6. Fill out Korea's e-Arrival Card tonight.","hop":{"min":15,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=35.011413,135.786762&destination=35.007950,135.769220&travelmode=transit"},"from_hotel":null}],"picks":[]}]},{"id":"osaka","n":4,"name":"Osaka","kanji":"大阪","dates":"Dec 9 – 11","nights":"2 nights","hotel":"crosshotel","hotel_note":"One block from Dotonbori; Amerikamura and Shinsaibashi are a 5-min walk. Alt: Hotel Royal Classic (kabuki-theater building, on Namba Station). Big suitcases forwarded to the Dec 13 Tokyo hotel on the morning of the 11th.","days":[{"date":"Wed Dec 9","title":"Osaka's kitchen, the knife street, Amerikamura, neon, Kobe beef, the lantern alley","stops":[{"pin":"kyotosta","time":"9:30am","note":"Shinkansen, 15 min. Bags come with you.","hop":{"min":10,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.985849,135.758767&travelmode=transit"},"from_hotel":{"min":10,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.985849,135.758767&travelmode=transit"}},{"pin":"crosshotel","time":"10:30am","note":"Drop bags.","hop":{"min":25,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=34.985849,135.758767&destination=34.669715,135.500763&travelmode=transit"},"from_hotel":null},{"pin":"kuromon","time":"11am","note":"Kuromon Market: grilled king crab legs, otoro, wagyu skewers, standing up.","hop":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.665351,135.506242&travelmode=walking"},"from_hotel":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.665351,135.506242&travelmode=walking"}},{"pin":"doguyasuji","time":"12:30pm","note":"150 m of pro kitchen shops: knives, takoyaki pans, the plastic display food. Closes 6pm.","hop":{"min":5,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.665351,135.506242&destination=34.664014,135.503506&travelmode=walking"},"from_hotel":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.664014,135.503506&travelmode=walking"}},{"pin":"shinsaibashi","time":"2pm","note":"600 m covered arcade: Uniqlo, drugstores, the giant Don Quijote. Tax-free with passport.","hop":{"min":12,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.664014,135.503506&destination=34.672509,135.501366&travelmode=walking"},"from_hotel":{"min":6,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.672509,135.501366&travelmode=walking"}},{"pin":"bbgarage","time":"3:30pm","note":"Amerikamura: vintage Americana, and the watch counter at the back. Ask if it's been overhauled and if the dial/hands are original. Open till 8, closed Wed → this is Wednesday: swap to Thursday if they're closed (see Dec 10).","hop":{"min":8,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.672509,135.501366&destination=34.670307,135.498575&travelmode=walking"},"from_hotel":{"min":4,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.670307,135.498575&travelmode=walking"}},{"pin":"dotonbori","time":"5:15pm","note":"The canal and the Glico man at dusk. Wanaka takoyaki standing up (one tray, you're eating at 7).","hop":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.670307,135.498575&destination=34.668647,135.503098&travelmode=walking"},"from_hotel":{"min":4,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.668647,135.503098&travelmode=walking"}},{"pin":"kokuryu","time":"7pm","note":"Kokuryu, 7F above Namba: Kobe-beef kaiseki, or the 20-course omakase (bluefin, wagyu, tempura). 4.9 across 1,700 reviews. Reserve.","hop":{"min":8,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.668647,135.503098&destination=34.667374,135.501432&travelmode=walking"},"from_hotel":{"min":5,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.667374,135.501432&travelmode=walking"}},{"pin":"hozenji","time":"9:30pm","note":"Hozenji Yokocho: the 1-block stone alley behind Dotonbori, lanterns, the moss-covered Buddha you splash with water. 2 min from dinner.","hop":{"min":3,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.667374,135.501432&destination=34.668119,135.502610&travelmode=walking"},"from_hotel":{"min":4,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.668119,135.502610&travelmode=walking"}},{"pin":"crosshotel","time":"10pm","note":"","hop":{"min":3,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.668119,135.502610&destination=34.669715,135.500763&travelmode=walking"},"from_hotel":null}],"picks":[{"pin":"wanaka","blurb":"Dotonbori: the takoyaki line locals stand in. Let them cool 5 min."},{"pin":"chibo","blurb":"Dotonbori: the okonomiyaki institution, griddled at your counter. If you'd rather sit than stand before Kokuryu, skip the tray."},{"pin":"rikuro","blurb":"Namba: the jiggly cheesecake, baked in front of you, ¥1,000. Grab one on the walk home; breakfast tomorrow."}]},{"date":"Thu Dec 10","title":"The lion-head shrine, whisky at the source, Umeda's mall city, then retro Osaka under the tower (and the slide)","stops":[{"pin":"nambayasaka","time":"8:45am","note":"Namba Yasaka: the shrine with a 40-ft lion head for a stage. 20 min, 10 from the hotel, empty this early.","hop":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.661559,135.496704&travelmode=walking"},"from_hotel":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.661559,135.496704&travelmode=walking"}},{"pin":"yamazaki","time":"10:30am","note":"Where Japanese whisky was born. Tour is a lottery 2 months out; tasting counter takes a reservation.","hop":{"min":40,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=34.661559,135.496704&destination=34.892457,135.674451&travelmode=transit"},"from_hotel":{"min":65,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.892457,135.674451&travelmode=transit"}},{"pin":"grandfront","time":"1:30pm","note":"Umeda: Grand Front, Hankyu, the underground mall maze. Lunch on the top-floor restaurant terrace.","hop":{"min":30,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=34.892457,135.674451&destination=34.703916,135.494010&travelmode=transit"},"from_hotel":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.703916,135.494010&travelmode=transit"}},{"pin":"bbgarage","time":"4pm","note":"B.B. Garage (open Thu). Vintage watches at the back. Skip if done Wednesday.","hop":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.703916,135.494010&destination=34.670307,135.498575&travelmode=transit"},"from_hotel":{"min":4,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.670307,135.498575&travelmode=walking"}},{"pin":"tsutenkaku","time":"6pm","note":"Shinsekai: the 1912 tower, kushikatsu counters, Showa-era signs. Go up for the night view, then take the 60-m spiral slide down (¥1,000). Early night: 7am airport train.","hop":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.670307,135.498575&destination=34.652499,135.506306&travelmode=transit"},"from_hotel":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.669715,135.500763&destination=34.652499,135.506306&travelmode=transit"}},{"pin":"crosshotel","time":"9pm","note":"Repack: Seoul is carry-on only. Big bags to the desk for forwarding.","hop":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=34.652499,135.506306&destination=34.669715,135.500763&travelmode=transit"},"from_hotel":null}],"picks":[{"pin":"bearpaw","blurb":"Uehonmachi: a bear's paw hands you your parfait through a hole in the wall. Cute, slow, 15 min from the hotel."},{"pin":"fsspa","blurb":"Dojima: the Four Seasons spa, 10 min from Umeda. A massage + ofuro soak instead of the second mall hour, if Mom wants it. Book ahead."},{"pin":"mrhiro","blurb":"Taisho: a JDM dream garage with a café and simulators, 5.0 across 3,700 reviews. Dad's, if he's a car guy; 25 min from Namba."},{"pin":"usj","blurb":"If you'd trade the whole Umeda/Yamazaki day: Super Nintendo World + Harry Potter. It's a full day and a 10,000-step crowd. Not worth it for two 50-year-olds who don't game; left here so you can overrule."},{"pin":"katsuoji","blurb":"Minoh: the temple of 10,000 red daruma dolls, 1 hr out by train + bus; pair with Minoh Falls (40-min walk down). The better trade for the Umeda afternoon if you want nature over malls."}]}]},{"id":"seoul","n":5,"name":"Seoul","kanji":"서울","dates":"Dec 11 – 13","nights":"2 nights","hotel":"andaz","hotel_note":"Gangnam, where every clinic is. Pool, sauna, hot tub on site for contrast bathing. Direct subway access from B2. Use Naver Map or KakaoMap here; Google Maps can't route in Korea.","days":[{"date":"Fri Dec 11","title":"Land, Dad's veneers start, Mom's IV, the oxygen chamber, Garosu-gil, Korean beef","stops":[{"pin":"namba","time":"6:50am","note":"7am airport express (45 min).","hop":null,"from_hotel":null},{"pin":"kix","time":"7:45am","note":"Morning flight to Incheon, 2h.","hop":{"min":45,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=34.662700,135.502100&destination=34.431999,135.236602&travelmode=transit"},"from_hotel":null},{"pin":"icn","time":"11am","note":"Through immigration by noon with the e-Arrival Card. AREX + subway to Gangnam.","hop":{"min":120,"mode":"flight","url":"https://www.google.com/maps/dir/?api=1&origin=34.431999,135.236602&destination=37.458666,126.441968&travelmode=transit"},"from_hotel":{"min":105,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.458666,126.441968&travelmode=transit"}},{"pin":"andaz","time":"1pm","note":"Drop bags.","hop":{"min":75,"mode":"train","url":"https://www.google.com/maps/dir/?api=1&origin=37.458666,126.441968&destination=37.525488,127.028920&travelmode=transit"},"from_hotel":null},{"pin":"lucid","time":"2pm","note":"DAD: Lucid Dental, 3–4F, 606 Nonhyeon-ro, 10 min from the hotel. Veneers ('Lucinate' laminates): consult, scan, prep and temporaries today (Fri till 6), final seat tomorrow. Send photos on WhatsApp now and confirm two visits is enough. Quoted ₩9.8M (~$7,000) for a full set; not in the budget.","hop":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.507916,127.034088&travelmode=transit"},"from_hotel":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.507916,127.034088&travelmode=transit"}},{"pin":"hanaclinic","time":"2pm","note":"MOM: Hana Clinic, Apgujeong: longevity consult + NAD+ or glutathione IV, 90 min. English, WhatsApp bookings.","hop":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.507916,127.034088&destination=37.528293,127.037446&travelmode=transit"},"from_hotel":{"min":15,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.528293,127.037446&travelmode=walking"}},{"pin":"o2on","time":"4pm","note":"Hyperbaric oxygen, 60 min. Mom first; Dad joins if the dentist lets him out.","hop":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.528293,127.037446&destination=37.520743,127.030209&travelmode=transit"},"from_hotel":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.520743,127.030209&travelmode=walking"}},{"pin":"garosugil","time":"5:30pm","note":"Tree-lined boutique street, 10 min from the chamber. Olive Young for the K-beauty haul (tax-free with passport).","hop":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.520743,127.030209&destination=37.521057,127.022869&travelmode=walking"},"from_hotel":{"min":13,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.521057,127.022869&travelmode=walking"}},{"pin":"andaz","time":"8pm","note":"Hanwoo BBQ dinner in Sinsa or Apgujeong (ask the hotel). Then hot tub → cold plunge → sauna before bed. Nothing to eat or drink after midnight: tomorrow starts fasting.","hop":{"min":15,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.521057,127.022869&destination=37.525488,127.028920&travelmode=transit"},"from_hotel":null}],"picks":[]},{"date":"Sat Dec 12","title":"The full-body scan, then skin, veneers, scalp, custom skincare, Seongsu","stops":[{"pin":"snuh","time":"7:30am","note":"Both: Seoul National University Hospital's Gangnam Center, 38–40F of the Finance Center. The comprehensive checkup: bloods, cardiac CT, abdominal ultrasound, DEXA, sedated endoscopy, plus the brain MRI/MRA add-on. 3–4 hours, English results in a week. Saturday runs till noon. Book NOW (4–6 weeks lead). ~$900–1,500 pp. This is the 'high-tech stuff they've never seen'.","hop":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.500023,127.036469&travelmode=transit"},"from_hotel":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.500023,127.036469&travelmode=transit"}},{"pin":"reberry","time":"1:30pm","note":"MOM: Reberry: AI skin profiling, then botox (forehead/eyes, 20 min) and the LDM glow, or Thermage if she wants the lift. ~2 hrs. Book 2–4 weeks ahead.","hop":{"min":10,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.500023,127.036469&destination=37.501840,127.024645&travelmode=transit"},"from_hotel":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.501840,127.024645&travelmode=transit"}},{"pin":"lucid","time":"1:30pm","note":"DAD: final fitting and bonding of the veneers (Sat till 4).","hop":{"min":5,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.501840,127.024645&destination=37.507916,127.034088&travelmode=transit"},"from_hotel":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.507916,127.034088&travelmode=transit"}},{"pin":"parkjun","time":"4:15pm","note":"Both: 15-step scalp spa + neck/back massage in a private room, 90 min. The massage of the trip.","hop":{"min":15,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.507916,127.034088&destination=37.518496,127.050210&travelmode=transit"},"from_hotel":{"min":15,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.518496,127.050210&travelmode=transit"}},{"pin":"amore","time":"6:30pm","note":"Amore Seongsu: AI skin scan and a custom-formulated serum / lipstick. Then Seongsu-dong: warehouses turned cafés, the sneaker shops. Open till 8:30.","hop":{"min":30,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.518496,127.050210&destination=37.544410,127.059120&travelmode=transit"},"from_hotel":{"min":20,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.544410,127.059120&travelmode=transit"}},{"pin":"andaz","time":"9:30pm","note":"Dinner in Seongsu (chimaek or a pocha), noraebang if there's gas left.","hop":{"min":30,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.544410,127.059120&destination=37.525488,127.028920&travelmode=transit"},"from_hotel":null}],"picks":[{"pin":"myshopper","blurb":"Sinsa: the 16-type personal color analysis, 1 hr, ~$100. Squeeze in before Park Jun if Reberry runs short."},{"pin":"seongsu","blurb":"Seongsu-dong: the Brooklyn of Seoul. Already on tonight's route."}]},{"date":"Sun Dec 13","title":"Sunrise city-wall hike, ginseng chicken, the palace in hanbok, fly to Tokyo","stops":[{"pin":"inwangsan","time":"7:30am","note":"Inwangsan: 1.5 hrs up the Seoul fortress wall to the summit at sunrise. Granite, stairs, the whole skyline. Trail shoes.","hop":{"min":35,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.581241,126.954548&travelmode=transit"},"from_hotel":{"min":35,"mode":"taxi","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.581241,126.954548&travelmode=transit"}},{"pin":"tosokchon","time":"10am","note":"Tosokchon samgyetang: whole ginseng chicken soup, the recovery meal. Opens 10, be in line at 9:50.","hop":{"min":15,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.581241,126.954548&destination=37.577779,126.971591&travelmode=walking"},"from_hotel":{"min":35,"mode":"subway","url":"https://www.google.com/maps/dir/?api=1&origin=37.525488,127.028920&destination=37.577779,126.971591&travelmode=transit"}},{"pin":"gyeongbok","time":"11am","note":"Rent hanbok by the gate (free palace entry). The photo op of the trip. Non-negotiable. One hour, then out.","hop":{"min":10,"mode":"walk","url":"https://www.google.com/maps/dir/?api=1&origin=37.577779,126.971591&destination=37.579617,126.977041&travelmode=walking" const PINS = DATA.pins, CITIES = DATA.cities;
const DAYCOL = ['var(--d1)','var(--d2)','var(--d3)','var(--d4)'];
const MODEICON = {walk:'🚶',hike:'🥾',train:'🚆',subway:'🚇',bus:'🚌',taxi:'🚕',flight:'✈️',ropeway:'🚡',shuttle:'🚐'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = m => m >= 60 ? (m%60 ? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : `${m/60}h`) : `${m} min`;
const hav = (a,b) => { const R=6371,r=Math.PI/180, dl=(b.lat-a.lat)*r, dn=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const bearing = (a,b) => { const d=Math.atan2(b.lng-a.lng, b.lat-a.lat)*180/Math.PI; return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d+360)%360)/45)%8]; };

// ---- projection ----
function project(pins, W, H, pad){
  const lat0 = pins.reduce((s,p)=>s+p.lat,0)/pins.length, k = Math.cos(lat0*Math.PI/180);
  const xs = pins.map(p=>p.lng*k), ys = pins.map(p=>-p.lat);
  let minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const spanx = Math.max(maxx-minx, 0.002), spany = Math.max(maxy-miny, 0.002);
  const s = Math.min((W-2*pad)/spanx, (H-2*pad)/spany);
  const ox = (W - spanx*s)/2 - minx*s, oy = (H - spany*s)/2 - miny*s;
  return { xy: p => [p.lng*k*s + ox, -p.lat*s + oy], kmPx: s/111 }; // px per km (lat degree = 111 km)
}

function scaleBar(kmPx, W, H){
  const target = 90; // px
  const nice = [0.2,0.5,1,2,5,10,20,50,100];
  let km = nice.find(v => v*kmPx >= target) || 100;
  const px = km*kmPx, x = W-16-px, y = H-16;
  return `<g class="scale"><line x1="${x}" y1="${y}" x2="${x+px}" y2="${y}"/><line x1="${x}" y1="${y-4}" x2="${x}" y2="${y+4}"/><line x1="${x+px}" y1="${y-4}" x2="${x+px}" y2="${y+4}"/><text x="${x+px/2}" y="${y-7}" text-anchor="middle">${km} km</text></g>`;
}

// ---- city panel ----
function renderCity(c){
  const hotel = PINS[c.hotel];
  const panel = document.createElement('section'); panel.className='panel'; panel.id='panel-'+c.id;
  // order of pins across the city
  const order = []; const seen = new Set([c.hotel]);
  c.days.forEach((d,di) => d.stops.forEach(s => { if(!seen.has(s.pin)){ seen.add(s.pin); order.push({pin:s.pin, day:di}); } }));
  const numOf = {}; let n=0; order.forEach(o => { if (PINS[o.pin].type==='stop') numOf[o.pin] = ++n; });

  const dayLegend = c.days.map((d,i)=>`<span><i class="dot" style="background:${DAYCOL[i]}"></i>${esc(d.date.split(' · ')[0])}</span>`).join('');
  panel.innerHTML = `
    <div class="panel-head"><h2>${String(c.n).padStart(2,'0')} · ${esc(c.name)}</h2><span class="kanji">${esc(c.kanji)}</span><span class="meta">${esc(c.dates)} · ${esc(c.nights)}</span></div>
    <div class="hotel-line"><i class="dot sleep"></i><div><a href="${hotel.url}" target="_blank" rel="noopener">${esc(hotel.name)} ↗</a> <span class="n">${esc(c.hotel_note)}</span></div></div>
    <div class="grid">
      <div class="mapcard">
        <div class="mapbar"><div class="days">${dayLegend}</div><div class="zoom" id="zoom-${c.id}" role="group" aria-label="Zoom"></div></div>
        <div id="svgwrap-${c.id}"></div>
        <div class="offmap" id="offmap-${c.id}" hidden></div>
        <div class="detail" id="detail-${c.id}"><span class="m">Tap a pin or a stop to see how far it is from ${esc(hotel.short)}.</span></div>
      </div>
      <div class="days-list" id="days-${c.id}"></div>
    </div>`;

  // days list
  const list = panel.querySelector('#days-'+c.id);
  c.days.forEach((d,di) => {
    const day = document.createElement('article'); day.className='day'; day.style.setProperty('--dc', DAYCOL[di]);
    const isB = /50/.test(d.date);
    const [dd, extra] = d.date.split(' · ');
    day.innerHTML = `<h3><span class="date">${esc(dd)}</span>${extra?`<span class="bday">★ ${esc(extra)}</span>`:''}</h3><p class="tt">${esc(d.title)}</p><ol class="stops"></ol>`;
    const ol = day.querySelector('ol');
    d.stops.forEach((s,si) => {
      const p = PINS[s.pin];
      const li = document.createElement('li'); li.className='stop'; li.dataset.pin=s.pin;
      const badge = p.type==='sleep' ? `<span class="badge sleep">⌂</span>` : p.type==='transit' ? `<span class="badge transit">${MODEICON[(s.hop&&s.hop.mode)||'train']||'•'}</span>` : `<span class="badge">${numOf[s.pin]||''}</span>`;
      let hop = '';
      if (s.hop) hop = `<a class="chip" href="${s.hop.url}" target="_blank" rel="noopener" title="Live directions in Google Maps">${MODEICON[s.hop.mode]||''} ≈ ${fmt(s.hop.min)} <span class="arrow">from previous ↗</span></a>`;
      let fh = '';
      if (s.from_hotel && p.type!=='sleep') fh = `<a class="chip h" href="${s.from_hotel.url}" target="_blank" rel="noopener" title="Live directions in Google Maps">${MODEICON[s.from_hotel.mode]||''} ≈ ${fmt(s.from_hotel.min)} <span class="arrow">from ${esc(hotel.short)} ↗</span></a>`;
      li.innerHTML = `${badge}<span class="time">${esc(s.time)}</span><div class="body"><div class="name"><a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a></div>${s.note?`<div class="note">${esc(s.note)}</div>`:''}<div class="chips">${hop}${fh}</div></div>`;
      li.addEventListener('click', e => { if (e.target.closest('a')) return; select(c, s.pin, hotel); });
      ol.appendChild(li);
    });
    if (d.picks && d.picks.length){
      const pk = document.createElement('div'); pk.className='picks';
      pk.innerHTML = `<b>While you're here · nothing scheduled</b>` + d.picks.map(x => { const p = PINS[x.pin]; return `<span class="pk">☆ <a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a> <span>${esc(x.blurb)}</span></span>`; }).join('');
      day.appendChild(pk);
    }
    list.appendChild(day);
  });

  const draw = () => drawMap(c, hotel, order, numOf, panel);
  draw();
  return panel;
}

// zoom levels: km radius from the hotel. Only levels that change the pin set are offered.
const ZOOMS = [{id:'near',label:'Around the hotel',r:3.5},{id:'city',label:'City',r:15},{id:'all',label:'Day trips',r:Infinity}];
function drawMap(c, hotel, order, numOf, panel){
  const W=560, H=430, pad=42;
  const all = [hotel].concat(order.map(o=>PINS[o.pin]));
  const within = r => all.filter(p => hav(hotel,p) <= r);
  // distinct levels
  const levels = []; let lastN = -1;
  ZOOMS.forEach(z => { const n = within(z.r).length; if (n !== lastN && n > 1){ levels.push(z); lastN = n; } });
  let cur = state.zoomAll[c.id] || (levels.find(z=>z.id==='city') ? 'city' : levels[levels.length-1].id);
  if (!levels.some(z=>z.id===cur)) cur = levels[levels.length-1].id;
  const r = ZOOMS.find(z=>z.id===cur).r;
  const shown = within(r);
  const far = all.filter(p => hav(hotel,p) > r);
  const zb = panel.querySelector('#zoom-'+c.id);
  zb.innerHTML = levels.length>1 ? levels.map(z=>`<button type="button" data-z="${z.id}" aria-pressed="${z.id===cur}">${z.label}</button>`).join('') : '';
  zb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { state.zoomAll[c.id] = b.dataset.z; drawMap(c, hotel, order, numOf, panel); }));
  const off = panel.querySelector('#offmap-'+c.id);
  if (far.length){ off.hidden=false; off.innerHTML = 'Off this map: ' + far.map(p=>`<span><b>${esc(p.short)}</b> ${Math.round(hav(hotel,p))} km ${bearing(hotel,p)}</span>`).join(''); } else off.hidden=true;

  const {xy, kmPx} = project(shown, W, H, pad);
  const shownIds = new Set(shown.map(p=>p.id));
  let g = `<g class="grid">`;
  for (let i=1;i<6;i++){ g += `<line x1="${W*i/6}" y1="0" x2="${W*i/6}" y2="${H}"/><line x1="0" y1="${H*i/6}" x2="${W}" y2="${H*i/6}"/>`; }
  g += `</g>`;
  // routes per day
  c.days.forEach((d,di) => {
    const pts = d.stops.map(s=>PINS[s.pin]).filter(p=>shownIds.has(p.id)).map(p=>xy(p));
    if (pts.length>1) g += `<polyline class="route" style="stroke:${DAYCOL[di]}" points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`;
  });
  // pins
  const placed = [];
  const pinHtml = [], lblHtml = [];
  shown.forEach(p => {
    const [x,y] = xy(p);
    const dayIdx = (order.find(o=>o.pin===p.id)||{day:0}).day;
    let col = p.type==='sleep' ? 'var(--accent)' : p.type==='transit' ? 'var(--transit)' : DAYCOL[dayIdx];
    const r = p.type==='sleep' ? 10 : p.type==='transit' ? 6 : 9;
    let shape = p.type==='sleep' ? `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="3" fill="${col}"/>` : `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;
    const num = p.type==='stop' ? `<text class="num" x="${x}" y="${y+0.5}">${numOf[p.id]||''}</text>` : p.type==='sleep' ? `<text class="num" x="${x}" y="${y+0.5}">⌂</text>` : '';
    pinHtml.push(`<g class="pin" data-pin="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}">${shape}${num}</g>`);
    // label if room
    const crowded = placed.some(q => Math.hypot(q[0]-x,q[1]-y) < 26);
    placed.push([x,y]);
    if (!crowded || p.type==='sleep'){
      const right = x < W*0.72;
      lblHtml.push(`<text class="lbl ${p.type}" x="${right?x+r+4:x-r-4}" y="${y+4}" text-anchor="${right?'start':'end'}">${esc(p.short)}</text>`);
    }
  });
  const svg = `<svg class="map" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-label="Map of ${esc(c.name)} stops">${g}${pinHtml.join('')}${lblHtml.join('')}${scaleBar(kmPx,W,H)}</svg>`;
  const wrap = panel.querySelector('#svgwrap-'+c.id); wrap.innerHTML = svg;
  wrap.querySelectorAll('.pin').forEach(el => {
    el.addEventListener('click', () => select(c, el.dataset.pin, hotel));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); select(c, el.dataset.pin, hotel);} });
  });
  if (state.sel) select(c, state.sel, hotel, true);
}

function select(c, pid, hotel, quiet){
  state.sel = pid;
  const panel = document.getElementById('panel-'+c.id);
  panel.querySelectorAll('.pin').forEach(el => el.classList.toggle('sel', el.dataset.pin===pid));
  panel.querySelectorAll('.stop').forEach(el => el.classList.toggle('sel', el.dataset.pin===pid));
  const p = PINS[pid];
  // find first occurrence for from-hotel + hop
  let occ=null, dayName='';
  for (const d of c.days){ const s = d.stops.find(s=>s.pin===pid); if (s){ occ=s; dayName=d.date; break; } }
  const det = panel.querySelector('#detail-'+c.id);
  const km = hav(hotel,p);
  let lines = `<div class="t">${esc(p.name)}</div><div class="m">${esc(dayName)}${occ&&occ.time?` · ${esc(occ.time)}`:''}${p.id!==hotel.id?` · ${km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km'} from ${esc(hotel.short)}`:''}</div>`;
  const links = [];
  if (occ && occ.from_hotel && p.id!==hotel.id) links.push(`<a href="${occ.from_hotel.url}" target="_blank" rel="noopener">${MODEICON[occ.from_hotel.mode]||''} ≈ ${fmt(occ.from_hotel.min)} from ${esc(hotel.short)} · live directions ↗</a>`);
  if (occ && occ.hop) links.push(`<a href="${occ.hop.url}" target="_blank" rel="noopener">${MODEICON[occ.hop.mode]||''} ≈ ${fmt(occ.hop.min)} from previous stop ↗</a>`);
  links.push(`<a href="${p.url}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`);
  det.innerHTML = lines + `<div class="links">${links.join('')}</div>`;
  if (!quiet){ const row = panel.querySelector(`.stop[data-pin="${pid}"]`); if (row && window.innerWidth>=900) row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}

// ---- overview ----
function renderRoute(){
  const sec = document.createElement('section'); sec.className='panel';
  const bases = CITIES.map(c=>PINS[c.hotel]);
  const W=720, H=420, pad=56;
  const {xy, kmPx} = project(bases, W, H, pad);
  let g = `<g class="grid">`; for (let i=1;i<6;i++){ g += `<line x1="${W*i/6}" y1="0" x2="${W*i/6}" y2="${H}"/><line x1="0" y1="${H*i/6}" x2="${W}" y2="${H*i/6}"/>`; } g += `</g>`;
  DATA.legs.forEach(l => {
    const a=xy(PINS[l.a]), b=xy(PINS[l.b]); const fl = /Flight/.test(l.how);
    g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--accent)" stroke-width="${fl?1.2:2}" stroke-dasharray="${fl?'2 5':'5 4'}" opacity=".8"/>`;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    g += `<text class="lbl" x="${mx}" y="${my-6}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${esc(l.dur)}</text>`;
  });
  CITIES.forEach((c,i) => {
    const p = PINS[c.hotel]; const [x,y]=xy(p);
    const jitter = (c.id==='tokyo2') ? 14 : 0; // Tokyo appears twice (Shinjuku / Marunouchi)
    g += `<g><rect x="${x-9}" y="${y-9+jitter}" width="18" height="18" rx="3" fill="var(--accent)" stroke="var(--map)" stroke-width="1.5"/><text class="num" x="${x}" y="${y+jitter+0.5}" style="font-size:9px">${c.n}</text>`;
    const right = x < W*0.6;
    g += `<text class="lbl sleep" x="${right?x+14:x-14}" y="${y+jitter+4}" text-anchor="${right?'start':'end'}">${esc(c.name)} <tspan style="font-weight:400;fill:var(--muted)">${esc(c.dates)}</tspan></text></g>`;
  });
  const svg = `<svg class="map" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-label="Route map">${g}${scaleBar(kmPx,W,H)}</svg>`;
  const legs = DATA.legs.map((l,i) => `<li><div><div>${esc(PINS[l.a].short==='Metropolitan'?'Tokyo':CITIES[i].name)} → ${esc(CITIES[i+1].name)}</div><div class="how">${esc(l.how)}</div></div><div><div class="dur">${esc(l.dur)}</div><div class="cost">${esc(l.cost)}</div></div></li>`).join('');
  sec.innerHTML = `
    <div class="panel-head"><h2>The shape of it</h2><span class="meta">16 nights · 14 Japan, 2 Korea · Tokyo, a Kanazawa onsen, five nights in Kyoto, two in Osaka, three days in Seoul, back to Tokyo for the flight home</span></div>
    <div class="ov">
      <div class="mapcard"><div class="mapbar"><div class="days"><span><i class="dot sleep"></i>Where you sleep</span><span>— — train · · · flight</span></div></div>${svg}</div>
      <div><ol class="legs">${legs}</ol>
        <p class="note"><b>How to read the times.</b> Intercity legs are the itinerary's own numbers. Inside each city, "≈" times are estimates from the itinerary plus typical transit; every chip opens live Google Maps directions so the real number is one tap away. In Seoul, Google Maps can't do walking or driving: use Naver Map or KakaoMap for the last few hundred meters.</p>
        <p class="note"><b>Pick a stop above</b> to see its pins to scale, numbered in the order you visit them, with the hotel as the anchor.</p>
      </div>
    </div>`;
  return sec;
}

// boot
const start = (location.hash||'').replace('#','');
show(TABS.some(t=>t.id===start) ? start : 'route', false);
window.addEventListener('hashchange', () => { const h=(location.hash||'').replace('#',''); if (TABS.some(t=>t.id===h) && h!==state.city) show(h,false); });
</script>
